  category: education,life
  name: About This Plugin
  description: NYC Public School Lunch shows today's official NYC Department of Education lunch menu and a preview of the next school day on your TRMNL.<br><br>Pick from fifteen DOE menus—Pre-K through 8, High School, Express Hot and Cold, Vegetarian, Halal options, Food Court, and Infant/Toddler—so the screen matches what your school actually serves. Dietary markers call out vegetarian (V), vegan (VE), and Halal (H) items when they apply, and salad bar notes appear when the DOE publishes them. Data refreshes from the public NYC DOE school-food menus, so you do not need an API key or account. Use it at home to plan mornings, pack backups, or answer the daily "what's for lunch?" question. Source code and issue tracking live on GitHub; feedback and menu corrections are welcome through the repository linked below.

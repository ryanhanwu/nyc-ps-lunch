---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.2
serverless_language: ''
refresh_interval_floor: ''
polling_url: https://trmnl-nyc-ps-lunch.ryanhanwu.workers.dev/lunch?menu={{ menu_type }}
polling_headers: ''
polling_body: ''
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: menu_type
  field_type: select
  name: School Lunch Menu
  description: Select the NYC Public Schools lunch menu to display
  default: Pre-K - 8 Lunch Menu
  options:
  - Pre-K - 8 Lunch Menu
  - Pre-K - 8 Lunch Menu With Halal Option
  - Pre-K - 8 Vegetarian Lunch Menu
  - Pre-K - 8 Express Hot Lunch Menu
  - Pre-K - 8 Express Hot Lunch Menu With Halal Option
  - Pre-K - 8 Express Cold Lunch Menu
  - Pre-K - 8 Express Cold Lunch Menu With Halal Option
  - High School Lunch Menu
  - High School Lunch Menu With Halal Option
  - High School Express Hot Lunch Menu
  - High School Express Hot Lunch Menu With Halal Option
  - High School Express Cold Lunch Menu
  - Food Court Menu
  - Food Court Menu With Halal Option
  - Infant Toddler Lunch Menu
- keyname: author_bio
  field_type: author_bio
  category: education,family
  name: About This Plugin
  description: Displays NYC Public Schools daily lunch menu and upcoming school days directly from the NYC Department of Education.<br><br>Choose from 15 official NYC DOE menus including Pre-K – 8, High School, Express Hot/Cold, Vegetarian, Halal, Food Court, and Infant/Toddler options.
  github_url: https://github.com/ryanhanwu/nyc-ps-lunch
name: NYC School Lunch Menu
description: NYC Public Schools daily & upcoming lunch menus
refresh_interval: 60
